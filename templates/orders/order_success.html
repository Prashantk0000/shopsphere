{% extends 'base.html' %}
{% load humanize %}
{% block content %}
<div class="container text-center py-5">
    <i class="bi bi-check-circle-fill display-1 text-success"></i>
    <h2 class="mt-3">Thank you! Your order has been placed.</h2>
    <p class="text-muted">Order Number: <strong>{{ order.order_number }}</strong></p>
    <p>Total: <strong>₹{{ order.get_total|intcomma }}</strong></p>
    <p>We'll send updates to <strong>{{ order.email }}</strong>.</p>
    <a href="{% url 'orders:order_detail' order.order_number %}" class="btn btn-primary">View Order</a>
    <a href="{% url 'store:product_list' %}" class="btn btn-outline-secondary">Continue Shopping</a>
</div>
{% endblock %}
