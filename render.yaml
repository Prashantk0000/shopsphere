services:
  - type: web
    name: shopsphere
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn shopsphere_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: shopsphere-db
          property: connectionString

databases:
  - name: shopsphere-db
    plan: free
