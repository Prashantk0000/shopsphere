version: '3.8'

services:
  web:
    build: .
    command: gunicorn shopsphere_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=docker-production-secret-key-shopsphere
      - ALLOWED_HOSTS=*
